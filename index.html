<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>家庭菜園ノート Ver.4</title>
<style>
:root{--green:#2f7d32;--bg:#f5f7f4;--card:#fff;--text:#203024;--muted:#68756b;--line:#dfe7df;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text)}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}.top{position:sticky;top:0;z-index:4;background:rgba(245,247,244,.94);backdrop-filter:blur(8px);padding:16px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}
main{padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #2030240a}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #cfd9cf;border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e9f1e9;color:#245b28}.danger{background:#fff0ef;color:var(--danger);border:1px solid #ffd3d0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:8px;align-items:center}
.small{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf5ed;color:#2f7d32;font-size:12px;margin:2px}
.score{font-size:20px;font-weight:800}.reason{font-size:13px;line-height:1.6;color:#4d5b50}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}.nav-inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{background:#fff;color:#66736a;border-radius:0;padding:12px 4px;font-size:12px}.nav button.active{color:var(--green);font-weight:800}
.hidden{display:none}.empty{text-align:center;padding:22px;color:var(--muted)}
.notice{padding:11px;border-radius:10px;background:#fff8df;border:1px solid #f1dda0;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>🌱 家庭菜園ノート</h1><div class="sub">Ver.4｜輪作・次作提案</div></header>
<main id="main"></main>
<nav class="nav"><div class="nav-inner">
<button id="tabPlots" onclick="showTab('plots')">🗺️ 区画</button>
<button id="tabCrops" onclick="showTab('crops')">🌱 作付け</button>
<button id="tabNext" onclick="showTab('next')">🔄 次作提案</button>
</div></nav>
</div>
<script>
const KEY='garden_v4_data';
const cropMaster=[
{name:'トマト',family:'ナス科',seasons:['春','夏'],harvest:'夏〜秋',days:90,rotation:3},
{name:'ナス',family:'ナス科',seasons:['春','夏'],harvest:'夏〜秋',days:100,rotation:3},
{name:'ピーマン',family:'ナス科',seasons:['春','夏'],harvest:'夏〜秋',days:90,rotation:3},
{name:'じゃがいも',family:'ナス科',seasons:['春','秋'],harvest:'春〜夏 / 秋〜冬',days:90,rotation:3},
{name:'きゅうり',family:'ウリ科',seasons:['春','夏'],harvest:'夏',days:60,rotation:2},
{name:'かぼちゃ',family:'ウリ科',seasons:['春','夏'],harvest:'夏〜秋',days:100,rotation:2},
{name:'すいか',family:'ウリ科',seasons:['春','夏'],harvest:'夏',days:100,rotation:2},
{name:'キャベツ',family:'アブラナ科',seasons:['春','秋'],harvest:'春 / 冬',days:100,rotation:2},
{name:'ブロッコリー',family:'アブラナ科',seasons:['春','秋'],harvest:'春 / 冬',days:90,rotation:2},
{name:'白菜',family:'アブラナ科',seasons:['秋'],harvest:'冬',days:80,rotation:2},
{name:'大根',family:'アブラナ科',seasons:['春','秋'],harvest:'春 / 冬',days:60,rotation:2},
{name:'かぶ',family:'アブラナ科',seasons:['春','秋'],harvest:'春 / 秋',days:50,rotation:2},
{name:'レタス',family:'キク科',seasons:['春','秋'],harvest:'春 / 秋',days:60,rotation:1},
{name:'にんじん',family:'セリ科',seasons:['春','秋'],harvest:'夏 / 冬',days:100,rotation:1},
{name:'ほうれん草',family:'ヒユ科',seasons:['春','秋','冬'],harvest:'春 / 秋〜冬',days:45,rotation:1},
{name:'玉ねぎ',family:'ヒガンバナ科',seasons:['秋'],harvest:'春',days:200,rotation:1},
{name:'枝豆',family:'マメ科',seasons:['春','夏'],harvest:'夏',days:90,rotation:1},
{name:'インゲン',family:'マメ科',seasons:['春','夏'],harvest:'夏',days:60,rotation:1},
{name:'とうもろこし',family:'イネ科',seasons:['春','夏'],harvest:'夏',days:90,rotation:1}
];

let data=JSON.parse(localStorage.getItem(KEY)||'null')||{plots:[],plantings:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function master(name){return cropMaster.find(x=>x.name===name)}
function family(name){return master(name)?.family||'その他'}
function years(){return [...new Set(data.plantings.map(p=>p.year))].sort((a,b)=>b-a)}
function showTab(t){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+(t==='plots'?'Plots':t==='crops'?'Crops':'Next')).classList.add('active');
  if(t==='plots') renderPlots(); else if(t==='crops') renderCrops(); else renderNext();
}
function renderPlots(){
 let m=`<div class="card"><div class="between"><div><h2>🗺️ 区画</h2><div class="small">区画ごとに輪作履歴を管理します。</div></div><button onclick="addPlot()">＋区画追加</button></div></div>`;
 if(!data.plots.length)m+=`<div class="card empty">まだ区画がありません。<br>「＋区画追加」から畝やプランターを登録してください。</div>`;
 data.plots.forEach(p=>{
   const ps=data.plantings.filter(x=>x.plotId===p.id).sort((a,b)=>b.year-a.year);
   m+=`<div class="card"><div class="between"><div><h3>${esc(p.name)}</h3><span class="tag">${esc(p.type||'畝')}</span></div><div class="row"><button class="secondary" onclick="editPlot('${p.id}')">編集</button><button class="danger" onclick="deletePlot('${p.id}')">削除</button></div></div>
   <div style="margin-top:10px"><b>作付け履歴</b></div>${ps.length?ps.slice(0,5).map(x=>`<div class="between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${x.year}年　${esc(x.crop)} <span class="tag">${family(x.crop)}</span></span><button class="danger" onclick="deletePlanting('${x.id}')">削除</button></div>`).join(''):'<div class="small" style="margin-top:8px">履歴なし</div>'}
   <div class="row" style="margin-top:10px"><button onclick="addPlanting('${p.id}')">＋作付け履歴</button><button class="secondary" onclick="showTab('next');setTimeout(()=>selectPlot('${p.id}'),0)">🔄 次作を提案</button></div></div>`;
 });
 document.getElementById('main').innerHTML=m;
}
function addPlot(){
 const name=prompt('区画名（例：畝A、プランター1）'); if(!name?.trim())return;
 const type=prompt('種類（例：畝、プランター）','畝')||'畝';
 data.plots.push({id:crypto.randomUUID(),name:name.trim(),type});save();renderPlots();
}
function editPlot(id){
 const p=data.plots.find(x=>x.id===id); if(!p)return;
 const name=prompt('区画名',p.name); if(!name?.trim())return;
 p.name=name.trim(); p.type=prompt('種類',p.type||'畝')||p.type;save();renderPlots();
}
function deletePlot(id){
 const p=data.plots.find(x=>x.id===id);if(!p)return;
 if(!confirm(`「${p.name}」を削除しますか？\n作付け履歴は残し、区画未設定にします。`))return;
 data.plots=data.plots.filter(x=>x.id!==id);data.plantings.forEach(x=>{if(x.plotId===id)x.plotId=''});save();renderPlots();
}
function addPlanting(plotId){
 const year=parseInt(prompt('作付け年',new Date().getFullYear()),10);if(!year)return;
 const list=cropMaster.map(x=>x.name).join('、');
 const crop=prompt('野菜名（登録例：'+list+'）');if(!crop?.trim())return;
 const found=cropMaster.find(x=>x.name===crop.trim());
 data.plantings.push({id:crypto.randomUUID(),plotId,year,crop:crop.trim(),family:found?.family||'その他'});
 save();renderPlots();
}
function deletePlanting(id){if(!confirm('この作付け履歴を削除しますか？'))return;data.plantings=data.plantings.filter(x=>x.id!==id);save();renderPlots()}
function renderCrops(){
 const opts=cropMaster.map(x=>`<option>${esc(x.name)}</option>`).join('');
 let m=`<div class="card"><h2>🌱 作付け履歴を追加</h2><div class="grid"><div><label>区画</label><select id="pPlot">${data.plots.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>年</label><input id="pYear" type="number" value="${new Date().getFullYear()}"></div></div><label>野菜</label><select id="pCrop">${opts}</select><button style="margin-top:10px" onclick="savePlanting()">登録する</button></div>`;
 const all=[...data.plantings].sort((a,b)=>b.year-a.year);
 m+=`<div class="card"><h2>📚 全作付け履歴</h2>${all.length?all.map(x=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)"><div>${x.year}年　<b>${esc(x.crop)}</b><br><span class="small">${esc(data.plots.find(p=>p.id===x.plotId)?.name||'区画未設定')} ・ ${family(x.crop)}</span></div><button class="danger" onclick="deletePlantingFromCrops('${x.id}')">削除</button></div>`).join(''):'<div class="empty">履歴がありません。</div>'}</div>`;
 document.getElementById('main').innerHTML=m;
}
function savePlanting(){const plotId=document.getElementById('pPlot')?.value;if(!plotId){alert('先に区画を登録してください');return}const year=parseInt(document.getElementById('pYear').value,10);const crop=document.getElementById('pCrop').value;data.plantings.push({id:crypto.randomUUID(),plotId,year,crop,family:family(crop)});save();renderCrops()}
function deletePlantingFromCrops(id){if(confirm('削除しますか？')){data.plantings=data.plantings.filter(x=>x.id!==id);save();renderCrops()}}
let selectedPlotId='';
function renderNext(){
 const defaultPlot=data.plots.find(p=>p.id===selectedPlotId)||data.plots[0];
 let m=`<div class="card"><h2>🔄 次作提案</h2><div class="small">過去4年の作付け、科、季節、栽培期間を使って候補をスコアリングします。</div>
 <label>区画</label><select id="nPlot" onchange="selectedPlotId=this.value;renderNext()">${data.plots.map(p=>`<option value="${p.id}" ${p.id===defaultPlot?.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
 <div class="grid"><div><label>植える時期</label><select id="nSeason" onchange="renderNext()">${['春','夏','秋','冬'].map(s=>`<option ${s===currentSeason()?'selected':''}>${s}</option>`).join('')}</select></div>
 <div><label>希望</label><select id="nPref" onchange="renderNext()"><option value="all">特になし</option><option value="leaf">葉物</option><option value="root">根菜</option><option value="bean">豆類</option><option value="summer">夏野菜</option><option value="winter">秋冬野菜</option></select></div></div></div>`;
 if(!defaultPlot){m+=`<div class="card empty">まず「🗺️ 区画」から区画を登録してください。</div>`;document.getElementById('main').innerHTML=m;return}
 const season=document.getElementById('nSeason')?.value||currentSeason(), pref=document.getElementById('nPref')?.value||'all';
 const hist=data.plantings.filter(x=>x.plotId===defaultPlot.id).sort((a,b)=>b.year-a.year);
 m+=`<div class="card"><h3>${esc(defaultPlot.name)} の履歴</h3>${hist.length?hist.slice(0,4).map(x=>`<span class="tag">${x.year} ${esc(x.crop)}・${family(x.crop)}</span>`).join(''):'<div class="small">まだ履歴がありません。履歴を登録すると精度が上がります。</div>'}</div>`;
 const results=rankCrops(hist,season,pref);
 const good=results.filter(x=>x.score>=55).slice(0,5), avoid=results.filter(x=>x.score<45).sort((a,b)=>a.score-b.score).slice(0,5);
 m+=`<div class="card"><h2>🌱 おすすめ</h2>${good.length?good.map(cardResult).join(''):'<div class="empty">条件に合う候補が少ないため、季節や希望を変更してください。</div>'}</div>`;
 m+=`<div class="card"><h2>⚠️ 今回は優先度を下げたい野菜</h2>${avoid.length?avoid.map(cardResult).join(''):'<div class="small">特に強い回避候補はありません。</div>'}</div>`;
 m+=`<div class="notice">※これは家庭菜園向けの輪作候補です。地域の気候、土壌、病害虫履歴などによって適否が変わるため、最終判断は栽培環境も確認してください。</div>`;
 document.getElementById('main').innerHTML=m;
}
function currentSeason(){const m=new Date().getMonth()+1;return m<=3?'春':m<=6?'春':m<=8?'夏':m<=11?'秋':'冬'}
function selectPlot(id){selectedPlotId=id;renderNext()}
function rankCrops(hist,season,pref){
 const recent=hist.slice(0,4), recentFamilies=recent.map(x=>family(x.crop));
 return cropMaster.map(c=>{
   let score=70, reasons=[];
   if(!c.seasons.includes(season)){score-=45;reasons.push('この時期は一般的な植え付け時期から外れます');}
   else {score+=10;reasons.push(`${season}に植えやすい候補`)}
   const sameIdx=recentFamilies.indexOf(c.family);
   if(sameIdx===0){score-=45;reasons.push(`直前作と同じ${c.family}`)}
   else if(sameIdx>0){score-=Math.max(15,35-sameIdx*7);reasons.push(`過去${sameIdx+1}年以内に${c.family}を作付け`)}
   else {score+=8;reasons.push('直近の作付けと異なる科')}
   const prefHit=(pref==='leaf'&&['キク科','アブラナ科','ヒユ科'].includes(c.family))||(pref==='root'&&['セリ科','アブラナ科'].includes(c.family))||(pref==='bean'&&c.family==='マメ科')||(pref==='summer'&&c.seasons.includes('夏'))||(pref==='winter'&&['秋','冬'].some(s=>c.seasons.includes(s)));
   if(pref!=='all'){if(prefHit){score+=12;reasons.push('希望条件に合う')}else score-=8}
   score=Math.max(0,Math.min(100,score));
   return {...c,score,reasons};
 }).sort((a,b)=>b.score-a.score);
}
function cardResult(c){
 const stars='★★★★★'.slice(0,Math.max(1,Math.min(5,Math.round(c.score/20))));
 return `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="between"><div><b>${esc(c.name)}</b> <span class="tag">${esc(c.family)}</span></div><div class="score">${stars}</div></div><div class="small">目安スコア ${c.score}/100 ・ 栽培期間 約${c.days}日</div><div class="reason">${c.reasons.slice(0,3).join('。')}。</div></div>`;
}
showTab('plots');
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body></html>
